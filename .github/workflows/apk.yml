# 云编译 APK：手动触发，产出 arm64 的 release 包。
# 签名：仓库 Secrets 里放好 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
# 就按 release 签（能覆盖已安装的包）；没放则用 debug 签名（安装前要先卸载旧包）。
name: APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      # Gradle 依赖与 wrapper：第二次起省 3–5 分钟
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 写入签名配置
        if: env.KEYSTORE_BASE64 != ''
        working-directory: app/android
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dshgo.keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/dshgo.keystore" "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > key.properties
          chmod 600 key.properties

      # 本机引擎的 Linux 运行时是 runtime/build-runtime.sh 的产物，不进仓库；
      # 这里从同版本官方包里取出（assets/runtime + 4 个 proot 相关 .so），
      # 否则编出来的 APK 只有 70MB、没有本机引擎。
      - name: 取出官方运行时
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/official.apk \
            https://github.com/ccch1mneyyy/dsh-Go/releases/download/v1.1.0/dsh-go-1.1.0-arm64.apk
          unzip -q /tmp/official.apk -d /tmp/official \
            'assets/runtime/*' \
            'lib/arm64-v8a/libproot.so' \
            'lib/arm64-v8a/libproot-loader.so' \
            'lib/arm64-v8a/libtalloc.so' \
            'lib/arm64-v8a/libandroid-shmem.so'
          mkdir -p runtime/out/arm64-v8a/assets runtime/out/arm64-v8a/jniLibs/arm64-v8a
          cp -a /tmp/official/assets/runtime runtime/out/arm64-v8a/assets/
          cp -a /tmp/official/lib/arm64-v8a/*.so runtime/out/arm64-v8a/jniLibs/arm64-v8a/
          du -sh runtime/out/arm64-v8a/assets/runtime runtime/out/arm64-v8a/jniLibs/arm64-v8a

      - name: 编译
        working-directory: app
        run: flutter build apk --release --flavor arm64 --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-apk
          if-no-files-found: error
          path: app/build/app/outputs/flutter-apk/*.apk
